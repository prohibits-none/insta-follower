services:
  - type: web
    name: insta-follower-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insta-follower-db
          property: connectionString

databases:
  - name: insta-follower-db
    plan: free
    databaseName: insta_follower
    user: insta_follower_user
